[package]
name = "tauri-plugin-kokoro-tts"
version = "0.1.0"
authors = ["Bilingify LLC"]
description = "Kokoro-82M offline TTS engine for Tauri using native ONNX Runtime"
edition = "2021"
rust-version = "1.77.2"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-kokoro-tts"

[dependencies]
tauri = { version = "2" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
schemars = "0.8"
ort = { version = "2.0.0-rc.9", default-features = false, features = ["ndarray", "download-binaries", "tls-rustls"] }
ndarray = "0.17"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
base64 = "0.22"
regex = "1"
unicode-segmentation = "1.11"
log = "0.4"
parking_lot = "0.12"
espeak-ng = { version = "0.1", features = ["bundled-data-en"] }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
schemars = "0.8"
